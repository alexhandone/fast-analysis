[project]
name = "fast-analysis"
version = "0.1.0"
description = "Local operational analytics with SQL Server, DuckDB and Polars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.6",
    "jupyterlab>=4.6.4",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
fast-analysis = "fast_analysis.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_analysis"]
